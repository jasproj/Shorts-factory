name: Generate voice samples (ElevenLabs)

on:
  push:
    branches: [main]
    paths: ["voice/tts.py", ".github/workflows/voices.yml"]
  workflow_dispatch:
    inputs:
      script_key:
        default: "01"
      voices:
        default: "FGY2WhTYpPnrIDTdsKH5,cgSgspJ2msm6clMCkdW9,9BWtsMINqrJLrRacOk9x"

permissions:
  contents: write

concurrency: voices

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Open the clips branch (shared output branch)
        run: |
          git fetch origin clips:clips 2>/dev/null && git worktree add out clips || {
            git worktree add --detach out
            git -C out checkout --orphan clips
            git -C out rm -rfq .
          }
      - name: Generate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 voice/tts.py scripts/batch-01.json "${{ github.event.inputs.script_key || '01' }}" \
            --voices "${{ github.event.inputs.voices || 'FGY2WhTYpPnrIDTdsKH5,cgSgspJ2msm6clMCkdW9,9BWtsMINqrJLrRacOk9x' }}" \
            --out out/voices
      - name: Save voices and log
        if: always()
        run: |
          cd out
          git config user.name "shorts-factory"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -qm "Voice samples run ${GITHUB_RUN_ID}"
          git push origin clips
